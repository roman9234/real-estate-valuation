on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:

  # тесты. публикуют отчёт о результатах

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run API tests
        run: pytest -v

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'backend/report.xml'

    # сборка обоих образов (бэк фронт)
    # на pull request только сборка (проверка Dockerfile),
    # на push в main — сборка + публикация в GHCR.

    build:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
        contents: read
        packages: write
      strategy:
        fail-fast: false
        matrix:
          service: [ backend, frontend ]

      steps:
        - uses: actions/checkout@v4

        - name: Compute lowercase image base
          run: echo "IMAGE_BASE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

        - uses: docker/setup-buildx-action@v3

        - name: Log in to GHCR
          if: github.event_name != 'pull_request'
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
            tags: |
              type=raw,value=${{ github.sha }}
              type=raw,value=latest,enable={{is_default_branch}}

        - uses: docker/build-push-action@v6
          with:
            context: ./${{ matrix.service }}
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha,scope=${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    deploy:
      needs: [ test, build ]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4

        - name: Prepare .env
          run: |
            REPO="${GITHUB_REPOSITORY,,}"
            echo "GH_REPO=${REPO}" > .env
            echo "IMAGE_TAG=${GITHUB_SHA}" >> .env

        - name: Copy files to server
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            source: "docker-compose.prod.yml,.env"
            target: "/opt/myapp"

        - name: Deploy
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            envs: GHCR_USER,GHCR_PAT
            script: |
              set -e
              cd /opt/myapp
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              docker logout ghcr.io
              docker image prune -f
          env:
            GHCR_USER: ${{ github.actor }}
            GHCR_PAT: ${{ secrets.GHCR_PAT }}