server {
    listen 80;
    server_name localhost;

    # Корень статики (результат vite build)
    root /usr/share/nginx/html;
    index index.html;

    # Статические файлы с кешированием
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router: все пути, не ведущие к файлу,
    # отдаём index.html → фронт сам разберёт роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси на backend (FastAPI)
    # Используем имя сервиса из docker-compose, не localhost
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
